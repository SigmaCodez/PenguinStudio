Penguin.Intro="Connectez votre première destination, puis ajoutez-en d’autres dans le panneau « Destinations de diffusion ». Le paysage suit votre programme principal. Le portrait génère une sortie distincte de 1080 × 1920 à partir du programme, avec un recadrage centré ou une image ajustée."
Penguin.KeysNote="Les clés de diffusion restent en mémoire pour cette session et doivent être saisies à nouveau après un redémarrage. Les URL de serveur et les paramètres des destinations sont enregistrés localement ; saisissez les secrets uniquement dans le champ de clé de diffusion."
Penguin.ConnectionNote="Utilisez le serveur et la clé de diffusion du tableau de bord créateur de votre plateforme. L’accès à la diffusion RTMP dépend de votre compte. Le panneau de connexions aux plateformes propose séparément la connexion aux comptes pris en charge."
Penguin.CapacityNote="Chaque destination utilise un encodeur H.264 distinct. Vérifiez la charge du processeur, le débit montant disponible et les règles de multidiffusion de la plateforme avant de lancer le direct."
