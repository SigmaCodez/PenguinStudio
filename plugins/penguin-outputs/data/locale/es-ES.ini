Penguin.Intro="Conecta tu primer destino y añade otros en el panel « Destinos de emisión ». El formato horizontal sigue el programa principal. El formato vertical genera una salida independiente de 1080 × 1920 a partir del programa, mediante un recorte centrado o un ajuste de la imagen."
Penguin.KeysNote="Las claves de emisión permanecen en memoria durante esta sesión y deben introducirse de nuevo tras reiniciar. Las URL de servidor y la configuración de destinos se guardan localmente; introduce los datos secretos solo en el campo de la clave de emisión."
Penguin.ConnectionNote="Utiliza el servidor y la clave de emisión del panel de creador de tu plataforma. El acceso a la emisión RTMP depende de tu cuenta. El panel de conexiones de plataformas ofrece por separado el inicio de sesión en las cuentas compatibles."
Penguin.CapacityNote="Cada destino utiliza un codificador H.264 independiente. Comprueba la carga de CPU, la capacidad de subida y las normas de emisión simultánea de la plataforma antes de emitir."
