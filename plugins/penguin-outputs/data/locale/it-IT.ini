Penguin.Intro="Collega la prima destinazione, poi aggiungine altre nel pannello “Destinazioni di trasmissione”. Il formato orizzontale segue il programma principale. Il formato verticale genera un’uscita separata di 1080 × 1920 dal programma, con ritaglio centrato o immagine adattata."
Penguin.KeysNote="Le destinazioni collegate a un account usano il suo accesso allo streaming. Le chiavi manuali restano in memoria solo per questa sessione e non vengono salvate nelle destinazioni."
Penguin.ConnectionNote="Collega Twitch o YouTube per configurare automaticamente lo streaming. La configurazione manuale con chiave resta disponibile per tutti i servizi."
Penguin.CapacityNote="Ogni destinazione usa un codificatore H.264 separato. Prima di andare in diretta, controlla il carico della CPU, la capacità di caricamento e le regole della piattaforma sulle trasmissioni simultanee."
