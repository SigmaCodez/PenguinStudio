Penguin.Intro="Collega la prima destinazione, poi aggiungine altre nel pannello “Destinazioni di trasmissione”. Il formato orizzontale segue il programma principale. Il formato verticale genera un’uscita separata di 1080 × 1920 dal programma, con ritaglio centrato o immagine adattata."
Penguin.KeysNote="Le chiavi di streaming rimangono in memoria per questa sessione e devono essere reinserite dopo il riavvio. Gli URL dei server e le impostazioni delle destinazioni vengono salvati localmente; inserisci i dati segreti solo nel campo della chiave di streaming."
Penguin.ConnectionNote="Usa il server e la chiave di streaming dalla dashboard per creatori della tua piattaforma. L’accesso allo streaming RTMP dipende dal tuo account. Il pannello delle connessioni alle piattaforme offre separatamente l’accesso agli account supportati."
Penguin.CapacityNote="Ogni destinazione usa un codificatore H.264 separato. Prima di andare in diretta, controlla il carico della CPU, la capacità di caricamento e le regole della piattaforma sulle trasmissioni simultanee."
