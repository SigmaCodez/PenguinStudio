Penguin.Intro="Conecte seu primeiro destino e adicione outros no painel “Destinos de transmissão”. O formato paisagem acompanha o programa principal. O formato retrato gera uma saída separada de 1080 × 1920 a partir do programa, com recorte centralizado ou ajuste da imagem."
Penguin.KeysNote="As chaves de transmissão ficam na memória durante esta sessão e devem ser inseridas novamente após reiniciar. As URLs dos servidores e as configurações dos destinos são salvas localmente; insira informações secretas apenas no campo da chave de transmissão."
Penguin.ConnectionNote="Use o servidor e a chave de transmissão do painel de criador da sua plataforma. O acesso à transmissão RTMP depende da sua conta. O painel de conexões com plataformas oferece separadamente o login nas contas compatíveis."
Penguin.CapacityNote="Cada destino usa um codificador H.264 separado. Verifique a carga da CPU, a capacidade de upload e as regras de transmissão simultânea da plataforma antes de entrar ao vivo."
