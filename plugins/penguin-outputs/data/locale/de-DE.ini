Penguin.Welcome="Dein Studio, jedes Format"
Penguin.Intro="Verbinde dein erstes Ziel und füge weitere im Dock „Übertragungsziele“ hinzu. Das Querformat folgt deinem Hauptprogramm. Das Hochformat erzeugt eine separate Ausgabe mit 1080 × 1920 aus dem Programm, mit mittigem Zuschnitt oder eingepasstem Bild."
Penguin.KeysNote="Streamschlüssel bleiben für diese Sitzung im Arbeitsspeicher und müssen nach einem Neustart erneut eingegeben werden. Server-URLs und Zieleinstellungen werden lokal gespeichert; trage vertrauliche Werte nur im Feld für den Streamschlüssel ein."
Penguin.ConnectionNote="Verwende den Server und Streamschlüssel aus dem Creator-Dashboard deiner Plattform. Der Zugriff auf RTMP-Streaming hängt von deinem Plattformkonto ab. Das Dock für Plattformverbindungen bietet die unterstützten Kontoanmeldungen separat an."
Penguin.CapacityNote="Jedes Ziel verwendet einen eigenen H.264-Encoder. Prüfe vor dem Livestart CPU-Auslastung, Upload-Kapazität und die Regeln deiner Plattform für gleichzeitige Übertragungen."
