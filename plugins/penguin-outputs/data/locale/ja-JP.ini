Penguin.Intro="最初の配信先を接続し、「配信先」ドックで追加の配信先を設定してください。横向き出力はメインプログラムを使用します。縦向き出力は、中央の切り抜きまたは全体を収める変換により、プログラムから独立した1080 × 1920の映像を生成します。"
Penguin.KeysNote="ストリームキーはこのセッション中のみメモリに保持され、再起動後に再入力が必要です。サーバーURLと配信先設定はローカルに保存されます。秘密情報はストリームキー欄のみに入力してください。"
Penguin.ConnectionNote="各プラットフォームのクリエイターダッシュボードにあるサーバーとストリームキーを使用してください。RTMP配信の利用可否はアカウントによって異なります。対応サービスへのアカウント認証は、プラットフォーム接続ドックで別途行えます。"
Penguin.CapacityNote="配信先ごとに独立したH.264エンコーダーを使用します。配信前にCPU負荷、アップロード帯域、各プラットフォームの同時配信規則を確認してください。"
