[Application]
name=io.github.SigmaCodez.PenguinStudio
runtime=org.freedesktop.Platform/x86_64/25.08
sdk=org.freedesktop.Sdk/x86_64/25.08
command=penguin-studio

[Context]
shared=network;ipc;
sockets=x11;wayland;pulseaudio;fallback-x11;
devices=all;
filesystems=xdg-run/pipewire-0;host;

[Session Bus Policy]
org.kde.StatusNotifierWatcher=talk
org.freedesktop.Flatpak=talk
org.freedesktop.Notifications=talk
org.a11y.Bus=talk

[Environment]
VST_PATH=/app/extensions/Plugins/vst

[Extension io.github.SigmaCodez.PenguinStudio.Plugin]
directory=plugins
autodelete=true
no-autodownload=true
subdirectories=true
add-ld-path=lib
merge-dirs=lib/obs-plugins;share/obs/obs-plugins

[Extension org.freedesktop.LinuxAudio.Plugins]
directory=extensions/Plugins
no-autodownload=true
subdirectories=true
add-ld-path=lib
merge-dirs=vst
version=25.08

[Extension io.github.SigmaCodez.PenguinStudio.Debug]
directory=lib/debug
autodelete=true
no-autodownload=true

[Build]
built-extensions=io.github.SigmaCodez.PenguinStudio.Debug;