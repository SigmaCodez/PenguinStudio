name: Penguin Studio Linux packages
on:
  push:
    branches: [main, master, penguin/**]
    tags: [penguin-v*]
    paths-ignore: ['**.md', 'docs/validation/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/validation/**']
  workflow_dispatch:
    inputs:
      packages:
        description: Package builds to run
        type: choice
        default: all
        options: [all, deb, deb-26.04, rpm, flatpak, snap]
      publish:
        description: Publish all packages for the current version (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: penguin-linux-${{ github.ref }}-${{ inputs.packages || 'all' }}
  cancel-in-progress: false
jobs:
  version:
    name: Validate version and release intent
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
          PACKAGE_SELECTION: ${{ inputs.packages || 'all' }}
        run: python3 scripts/packaging/release-version.py
  checks:
    needs: version
    name: Branding, translations, configuration, and OAuth
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate branding and translations
        run: |
          python3 scripts/check-branding.py
          python3 scripts/check-penguin-locales.py
      - name: Validate automatic releases
        run: python3 test/penguin-release.py
      - name: Check optional Linux runtime diagnostics
        run: bash scripts/packaging/test-optional-library.sh
      - name: Compile and run configuration isolation checks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I. test/penguin-config-paths.cpp -o /tmp/penguin-config-paths-test
          /tmp/penguin-config-paths-test
      - name: Compile and run OAuth callback checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-websockets-dev
          c++ -std=c++17 -Wall -Wextra -Werror -fPIC -I. test/penguin-oauth.cpp $(pkg-config --cflags --libs Qt6Core) -o /tmp/penguin-oauth-test
          /tmp/penguin-oauth-test
      - name: Check update selection and native Twitch chat
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fPIC -I. test/penguin-update-policy.cpp $(pkg-config --cflags --libs Qt6Core) -o /tmp/penguin-update-test
          /tmp/penguin-update-test
          c++ -std=c++17 -Wall -Wextra -Werror -fPIC -I. test/penguin-twitch-chat.cpp $(pkg-config --cflags --libs Qt6Widgets Qt6Network Qt6WebSockets) -o /tmp/penguin-chat-test
          QT_QPA_PLATFORM=offscreen /tmp/penguin-chat-test
      - name: Compile and run Qt button translation checks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fPIC -I. test/penguin-qt-translation.cpp $(pkg-config --cflags --libs Qt6Core) -o /tmp/penguin-qt-translation-test
          /tmp/penguin-qt-translation-test
      - name: Compile and run Qt Wayland diagnostic checks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fPIC -I. test/penguin-qt-wayland-diagnostics.cpp $(pkg-config --cflags --libs Qt6Core) -o /tmp/penguin-qt-wayland-diagnostics-test
          /tmp/penguin-qt-wayland-diagnostics-test
      - name: Compile and run startup activation checks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fPIC -I. test/penguin-startup-dialog.cpp $(pkg-config --cflags --libs Qt6Widgets) -o /tmp/penguin-startup-dialog-test
          QT_QPA_PLATFORM=offscreen /tmp/penguin-startup-dialog-test
  flatpak:
    needs: [version, checks]
    name: Flatpak (x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'flatpak'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          manifest-path: build-aux/io.github.SigmaCodez.PenguinStudio.json
          bundle: penguin-studio-${{ needs.version.outputs.version }}-x86_64.flatpak
          upload-artifact: false
          build-bundle: true
          cache-key: penguin-flatpak-${{ hashFiles('build-aux/io.github.SigmaCodez.PenguinStudio.json') }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penguin-studio-flatpak-x86_64
          path: '*.flatpak'
          if-no-files-found: error
  deb:
    needs: [version, checks]
    name: Ubuntu ${{ matrix.ubuntu }} DEB (amd64)
    if: github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || startsWith(inputs.packages, 'deb')
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ${{ fromJSON(inputs.packages == 'deb-26.04' && '["26.04"]' || '["24.04", "26.04"]') }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo bash scripts/packaging/install-build-deps.sh
      - name: Compile and package
        run: bash scripts/packaging/build-native.sh DEB
      - name: Validate DEB preflight
        run: |
          python3 test/penguin-deb-install.py
          bash scripts/packaging/install-deb.sh --check build_penguin_deb/penguin-studio_*.deb
      - name: Inspect package metadata
        run: dpkg-deb --info build_penguin_deb/penguin-studio_*.deb
      - name: Install DEB and verify launcher
        run: |
          sudo apt-get install -y ./build_penguin_deb/penguin-studio_*.deb
          penguin-studio --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penguin-studio-ubuntu-${{ matrix.ubuntu }}-amd64
          path: build_penguin_deb/*.deb*
          if-no-files-found: error
  rpm:
    needs: [version, checks]
    name: Fedora 44 RPM (x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'rpm'
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install checkout prerequisites
        run: dnf install -y git tar gzip ca-certificates
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install build dependencies
        run: bash scripts/packaging/install-build-deps.sh
      - name: Compile and package
        run: bash scripts/packaging/build-native.sh RPM
      - name: Inspect package metadata
        run: rpm -qp --info build_penguin_rpm/*.rpm
      - name: Install RPM and verify launcher
        run: |
          dnf install -y ./build_penguin_rpm/penguin-studio-*.rpm
          penguin-studio --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penguin-studio-fedora-44-x86_64
          path: build_penguin_rpm/*.rpm*
          if-no-files-found: error
  snap:
    needs: [version, checks]
    name: Snap core24 (amd64, development)
    if: github.event_name != 'workflow_dispatch' || inputs.packages == 'all' || inputs.packages == 'snap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Build snap
        run: sudo snapcraft --destructive-mode
      - name: Install Snap and verify confined launcher
        run: |
          sudo snap install --dangerous ./penguin-studio_*.snap
          snap run penguin-studio --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penguin-studio-core24-amd64
          path: '*.snap'
          if-no-files-found: error
  release:
    name: Publish complete Linux download set
    needs: [version, checks, flatpak, deb, rpm, snap]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: penguin-release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: penguin-studio-*
          path: release-artifacts
      - name: Validate package set, checksums, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/packaging/publish-release.py release-artifacts
